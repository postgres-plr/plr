      - name: Install R for Windows R-x.y.z R-rmajor.rminor.rpatch
        if: ${{ env.osClass == 'windows' && env.compilerClass == 'Mingw' }}
        env:
          R_HOME: ${{ env.R_HOME }}
          R_ARCHplat: ${{ env.R_ARCHplat }}
        shell: cmd
        run: |
          echo on
          echo R_HOME: %R_HOME%
          echo R_ARCHplat: %R_ARCHplat%
          rem need "main" for the GUIs and command line utilites to work
          rem A comma at the end is O.K
          rem Component "notset" is ignored
          rem Install skips components that it does not know about
          "${{ env.rversionlong }}.exe" /VERYSILENT /COMPONENTS=main,%R_ARCHplat% /DIR=%R_HOME% /NOICONS /TASKS= /LOG=${{ env.rversionlong }}.exe__install.log /SAVEINF=${{ env.rversionlong }}.exe__setup.inf
          type ${{ env.rversionlong }}.exe__setup.inf
          type ${{ env.rversionlong }}.exe__install.log
          "%R_HOME%\bin\Rscript" --version
          "%R_HOME%\bin\Rscript" --vanilla -e "writeLines(paste0('R_HOME: ', R.home()))"
          "%R_HOME%\bin\Rscript" --vanilla -e "print(R.version)"
          dir "%R_HOME%"

      # Github Actions provided PostgreSQL x64-17 (as of OCT 2026)
      #
      # # OCT 2025
      # ServiceName postgresql-x64-17
      # Version 17.11
      # ServiceStatus Stopped
      # ServiceStartType Disabled
      # EnvironmentVariables PGBIN=C:\Program Files\PostgreSQL\17\bin
      # PGDATA=C:\Program Files\PostgreSQL\17\data
      # PGROOT=C:\Program Files\PostgreSQL\17
      # Path C:\Program Files\PostgreSQL\17
      # UserName postgres
      # Password root
      # #
      # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md
      # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-software
      #
      - name: From Disabled, Enable PostgreSQL x64-${{ env.GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION }} for Windows and Start and Stop
        if: >-
          ${{ env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.MingwtestonpgWIN == 'true' &&
          env.PGVER2 == env.GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION && env.Platform == 'x64'
          }}
        shell: cmd
        run: |
          echo on
          sc config "postgresql-x64-%GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION%" start= auto
          net start  postgresql-x64-%GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION%
          net stop   postgresql-x64-%GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION%

      - name: Install PostgreSQL for Windows and Stop PostgreSQL
        if: >-
          ${{ env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.MingwtestonpgWIN == 'true'  &&
          env.PGVER2 != env.GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION && env.Platform == 'x64' 
          }}
        env:
          PGVER2: ${{ env.PGVER2 }}
          PGROOT2: ${{ env.PGROOT2 }}
          Platform: ${{ env.Platform }}
        shell: cmd
        run: |
          echo on
          "${{ env.pgWINversionlong }}.exe" --unattendedmodeui none --mode unattended --enable-components server,commandlinetools --disable-components pgAdmin,stackbuilder --superpassword "root" > nul
          rem postgresql-17.11
          rem "C:\Program Files\PostgreSQL\17" (OCT 2026)
          rem "C:\Program Files\PostgreSQL\17\data"
          rem root
          rem 5432
          rem "Installation Directory: C:\Program Files\PostgreSQL\17"
          rem "Server Installation Directory: C:\Program Files\PostgreSQL\17"
          rem "Data Directory: C:\Program Files\PostgreSQL\17\data"
          rem "Database Port: 5432"
          rem "Database Superuser: postgres"
          rem "Operating System Account: NT AUTHORITY\NetworkService"
          rem "Database Service: postgresql-x64-17"
          rem "Command Line Tools Installation Directory: C:\Program Files\PostgreSQL\17"
          rem "Installation Log: C:\Users\%USERNAME%\AppData\Local\Temp\install-postgresql.log"
          rem
          rem "Starting the database server"
          rem
          rem Installation will also start PostgreSQL
          if "%Platform%"=="x64" (net stop postgresql-x64-%PGVER2%)
          if "%Platform%"=="x86" (net stop postgresql-%PGVER2%)
          if "%Platform%"=="notset" (echo Platform is not set, therefore no net stop happens.)
          dir "%PGROOT2%"

