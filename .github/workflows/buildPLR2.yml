      # Notice
      # Path R-2.11.1-x64
      # Download Name -R-2.11.1-win64.exe
      # https://cran-archive.r-project.org/bin/windows/base/old/2.11.1/R-2.11.1-win64.exe
      # Path R-2.11.1
      # Download Name - R-2.11.1-win32.exe
      # https://cran-archive.r-project.org/bin/windows/base/old/2.11.1/R-2.11.1-win32.exe
      #
      # five seconds
      - name: Download R from CRAN_R_DOWNLOAD_URL for Windows R-x.y.z R-rmajor.rminor.rpatch
        if: >-
          ${{ env.os == 'windows-2025-vs2026' && ( env.compilerClass == 'Mingw' ) &&
          env.CRAN_R_DOWNLOAD_URL != 'notset' &&
          steps.cacheRWindowsInstallerExe.outputs.cache-hit != 'true'
          }}
        uses: suisei-cn/actions-download-file@v1.6.1
        id: downloadfileRforWindows
        with:
          url: ${{ env.CRAN_R_DOWNLOAD_URL }}

      - name: Download R Development for Windows or Windows-Arm, x86_64 or aarch64, respectively
        if: >-
          ${{ env.compilerClass == 'Mingw' &&
          env.osClass == 'windows' && ( env.rversion == 'devel-aarch64' || env.rversion == 'devel-x86_64' )
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash # Git for Windows Bash
        run: |
          #
          # Note, since Aug 6, 2026, these are also available here (a second location)
          # https://github.com/r-devel/windows-arm64/releases
          #
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          gh repo set-default "${GITHUB_REPOSITORY}"
          git remote add "github_r-devel_r-svn" "https://github.com/r-devel/r-svn"
          gh repo set-default "r-devel/r-svn"
          gh run list --status success --limit 1
          export GITHUB_RUN_ID="notset"
          export GITHUB_RUN_ID=$(gh run list --status success --json databaseId --limit 1 | jq -r '.[0].databaseId')
          export "GITHUB_RUN_ID=${GITHUB_RUN_ID}" >>  ${GITHUB_ENV}
          echo "GITHUB_RUN_ID: ${GITHUB_RUN_ID}"
          if [ "${rversion}" == "devel-aarch64" ]
          then
            gh run download "${GITHUB_RUN_ID}" -n "Win-installer-aarch64"
          fi
          if [ "${rversion}" == "devel-x86_64" ]
          then
            gh run download "${GITHUB_RUN_ID}" -n "Win-installer-x86_64"
          fi
          gh repo set-default "${GITHUB_REPOSITORY}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"

      - name: Download PostgreSQL for Windows
        if: >-
          ${{ env.os == 'windows-2025-vs2026' && env.compilerClass == 'Mingw' && env.MingwtestonpgWIN == 'true' &&
          env.PGVER2 != env.GITHUB_ACTIONS_WINDOWS_RUNNER_PG_MAJOR_VERSION && env.Platform == 'x64' &&
          steps.cachePGWindowsInstallerExe.outputs.cache-hit != 'true'
          }}
        uses: suisei-cn/actions-download-file@v1.6.1
        id: downloadfilePGforWindows
        with:
          url: ${{ env.ENTDB_PG_DOWNLOAD_URL }}

