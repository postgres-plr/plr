          "GithubActionsIgnoreFail": "false",
          "compilerEnv": "CLANGARM64",
          "shellEnv": "msys2 {0}",
          "compilerExe": "clang",
          "Platform": "x64",
          "Configuration": "Debug",
          "rversion": "devel-aarch64",
          "R_HOME": "C:\\RINSTALL",
          "buildpgFromSRC": "false",
          "PG_HOME": "repo"
          },

          {
          "matid": "03",
