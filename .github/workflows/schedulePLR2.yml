          "compilerEnv": "UCRT64",
          "shellEnv": "msys2 {0}",
          "compilerExe": "gcc",
          "Platform": "x64",
          "Configuration": "Debug",
          "rversion": "devel-x86_64",
          "R_HOME": "C:\\RINSTALL",
          "R_ARCH": "/x64",
          "pgSRCversion": "master",
          "buildpgANDplrInSRCcontrib": "true",
          "PG_HOME": "C:\\PGINSTALL"
          },

          {
          "matid": "05",
          "os": "windows-2025-vs2026",
          "GithubActionsIgnoreFail": "false",
          "compilerEnv": "UCRT64",
          "shellEnv": "msys2 {0}",
          "compilerExe": "gcc",
          "Platform": "x64",
          "Configuration": "Debug",
          "rversion": "devel",
          "R_HOME": "C:\\RINSTALL",
          "R_ARCH": "/x64",
          "pgSRCversion": "master",
          "buildpgFromSRC": "true",
          "buildpgFromSRCmethod": "meson",
          "PG_HOME": "C:\\PGINSTALL"
